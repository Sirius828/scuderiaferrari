# Line Follower Controller Parameters (Standard PID)

/**:
  ros__parameters:
    # ==================== 标准PID参数 ====================
    # 50Hz控制循环下先以P/D为主，Ki只用于很小的稳态偏差修正。
    Kp: 0.84             # 比例增益：避免误差堆大后过度修正
    Ki: 0.0              # 积分增益：初调关闭，避免视觉噪声导致积分过冲
    Kd: 0.040            # 微分增益：增加阻尼，压住弯中穿越中心后的过冲
    enable_error_gain_schedule: true  # 随offset放大P增益；高offset时补足入弯舵量
    small_error_gain_scale: 1.14  # 小偏差/入弯初期更主动一点，减少迟钝
    large_error_gain_scale: 1.38  # 大偏差接近满舵能力，但不全局抬高Kp
    gain_schedule_full_error: 0.60  # abs有效offset达到该值时使用large_error_gain_scale，入弯更早给足P
    
    # ==================== 车辆参数 ====================
    linear_speed: 0.84     # 动态速度上限(m/s)；温和发车档，目标均速约0.6m/s
    enable_dynamic_speed: true  # 根据连续弯道强度动态调速；false时保持固定linear_speed
    min_linear_speed: 0.52  # 急弯/大offset地板速度，保持可控同时提高均速
    speed_offset_start: 0.05  # 关闭曲率自适应时，abs(offset)小于该值保持最高速度
    speed_offset_full_slow: 0.65  # 关闭曲率自适应时，abs(offset)达到该值后降到min_linear_speed
    speed_curve_exponent: 2.0  # >1时小弯/微偏差更保速，急弯时快速降速
    speed_accel_rate: 0.20  # 目标速度升高时的最大加速度(m/s^2)，避免刚出弯猛提速
    speed_decel_rate: 5.0  # 目标速度降低时的最大减速度(m/s^2)，入弯/大offset更及时压速
    speed_curve_offset_limit: 0.24  # 速度降速主要看offset，保留入弯压速但不过早趴到最低速
    speed_curve_heading_weight: 0.60  # heading加强入弯预判降速，避免offset变大后才减速
    speed_curve_curvature_weight: 0.25  # curvature轻度加强，弯道允许慢一点换稳定
    enable_curve_adaptive_control: true  # 用offset/heading/curvature连续估计弯道强度
    curve_offset_limit: 0.42  # abs(offset)达到该值时弯道强度约为1，更早进入弯道档
    curve_heading_limit: 0.46  # abs(heading_error)达到该值时弯道强度约为1，提前小舵入弯
    curve_curvature_limit: 2.00  # curvature经常被感知夹到±1，适度参与弯道判定
    curve_factor_smoothing_alpha: 0.35  # 兼容旧参数；新逻辑使用下面的上升/释放系数
    curve_factor_attack_alpha: 0.82  # 弯道强度上升系数，提前进入弯道但不过猛
    curve_factor_release_alpha: 0.07  # 弯道强度释放系数，避免刚回正就释放导致二次过冲
    offset_deadband: 0.025  # 小offset当作0，保留更多轻微偏差用于提前修正
    wheel_radius: 0.032    # Wheel radius in meters
    
    # ==================== 积分限幅 ====================
    integral_max: 0.25  # 积分项最大值，防止积分饱和
    max_steering: 0.75      # 关闭曲率自适应时的最大转向比例
    steering_slew_rate: 3.0  # 关闭曲率自适应时的最大转向变化率(比例/秒)
    steering_sign: 1.0  # 舵机方向；1保持底盘当前约定，-1用于硬件方向反装时诊断
    straight_max_steering: 0.32  # 直道/入弯初段放开更多舵量，避免弯口跟不上
    curve_max_steering: 1.00  # 急弯/低速时放开舵角，允许把大offset收回来
    straight_steering_slew_rate: 2.2  # 直道/入弯转向变化率限制，提前跟舵
    curve_steering_slew_rate: 6.0  # 弯道转向变化率限制；offset接近1时能更快给到舵量
    
    # ==================== 超时设置 ====================
    invalid_timeout: 1.0   # 短时丢线继续保持上一舵角，避免弯中周期性断感知直接断控
    enable_perception_stop: true  # 是否响应/perception/stop_request停车请求
    ignore_stop_requests: true  # 调车/跑圈时忽略感知stop_request；急停和手动接管仍有效
    perception_stop_timeout: 0.5  # 停车请求超过该时间未更新则自动解除，避免perception掉线永久停车
    autonomous_enabled_on_start: true  # 启动后默认待命，等待UI发车服务
    publish_stop_when_disabled: true  # 待命/禁用巡线时持续刷0；避免底盘保持最后一次速度/舵角
    enable_manual_override: true  # 键盘接管时释放/cmd_vel，避免和自动巡线冲突
    use_lane_state: true  # 订阅/perception/lane_state；旧center_offset仍保留为回退
    lane_state_timeout: 0.3  # lane_state超过该时间未更新时，仅使用旧center_offset
    low_confidence_threshold: 0.35  # 低于该置信度时不追随lane_state，避免假offset触发猛打
    low_confidence_hold_timeout: 1.0  # 低置信短暂出现时低速保持上一舵角的时间
    low_confidence_hold_speed: 0.36  # 低置信保持阶段的最高线速度(m/s)，超过超时后停车
    heading_gain: 0.0  # 不使用航向前馈，避免新感知heading在复杂路段抵消/放大舵量
    curvature_gain: 0.0  # 低速稳定档关闭曲率前馈，优先稳定offset

    # ==================== 弹射起步 ====================
    # 感知发布 task_state=START_BOOST 时触发一次开环冲刺；Go/Gate消失或超过时长后恢复PID。
    enable_start_boost: false
    start_boost_task_state: "START_BOOST"
    start_boost_duration: 0.7
    start_boost_speed: 0.8
    start_boost_steering: 0.0
    
    # ==================== 日志设置 ====================
    # normal: 原有低频控制日志
    # pid_tuning: 高频PID调参日志，带误差条
    # off: 关闭控制循环日志
    controller_log_mode: "pid_tuning"
    pid_tuning_log_hz: 30.0
    pid_tuning_bar_width: 41
    controller_debug_hz: 1.0
