# 感知决策节点配置文件
# 包含岔路口检测与外圈锁定参数

# ========================================
# 目标检测节点配置
# ========================================
object_detection_node:
  ros__parameters:
    shm_name: "shm_ar_video"
    model_path: "model/yolov8_n_det_split_int8_v2.rknn"  # 目标检测模型路径，bbox/score拆分输出，转换阶段适配0~1输入
    label_list_path: "model/label_list.txt"
    tpes: 1
    core_ids: [0]
    enable_flip: true
    flip_code: 0
    input_format: "RGB"
    publish_detections: true
    publish_rate: 0  # <=0 表示每个完成的检测结果都发布，不限速
    enable_perf_stats: false
    perf_interval: 2.0  # 每隔多少秒打印一次 detection 单帧耗时
    use_fast_postprocess: false  # false=使用旧后处理，稳定优先；true=启用实验性快速后处理
    model_input_width: 384
    model_input_height: 288

# ========================================
# 感知决策节点配置
# ========================================
perception_decision_node:
  ros__parameters:
    # ========================================
    # 基础参数
    # ========================================
    shm_name: "shm_ar_video"
    
    # ⭐ 模型路径参数
    seg_model_dir: "model"  # 语义分割模型目录
    seg_model_filename: "pp_liteseg_v3.rknn"  # 语义分割模型文件名；yolov8_seg_n_int8 是实例分割输出，不能直接作为语义mask
    
    seg_tpes: 2
    seg_core_ids: [1, 2]
    blend_alpha: -1.0  # -1表示只显示分割结果，不混合原图
    show_window: true
    enable_perf_stats: false
    
    # 图像预处理参数
    enable_flip: true
    flip_code: 0  # 0=垂直翻转, 1=水平翻转, -1=两者
    input_format: "RGB"
    model_input_format: "RGB"
    
    # 外圈方向配置
    outer_side: "left"  # "left" 或 "right"，取决于赛道布局
    
    # ========================================
    # ⭐ GuideBoard 岔路选择参数
    # ========================================
    enable_guideboard_branch_selection: true  # 是否启用GuideBoard岔路选择
    guideboard_branch: "right"  # 检测到GuideBoard时选择的岔路方向
    guideboard_detect_y0_ratio: 0.2  # GuideBoard检测起始y比例（0.0=顶部，1.0=底部）
    guideboard_detect_y1_ratio: 0.7  # GuideBoard检测结束y比例（默认检测上半部分70%区域）
                                     # 如需全画面检测，设置为 0.0 和 1.0
    
    # ========================================
    # ⭐ 高级岔路检测与中心线拟合参数（新逻辑）
    # ========================================
    
    # 功能开关
    enable_segment_branch_logic: true  # 启用多层Band扫描逻辑
    
    # Band 扫描参数
    band_count: 13  # 扫描Band的数量
    band_y_min_ratio: 0.65  # Band扫描起始y比例（0.0=顶部，1.0=底部）
    band_y_max_ratio: 1.00  # Band扫描结束y比例
    band_height_ratio: 0.02  # 每个Band的高度比例
    
    # Segment 提取参数
    min_segment_width_px: 25  # Segment最小宽度（像素）
    min_segment_gap_px: 40  # 两个Segment之间的最小间隙（像素）
    min_pixels_per_band: 80  # 每个Band中Segment的最小像素数量
    
    # 岔路确认参数
    branch_detect_min_bands: 2  # 至少需要多少个Band检测到2+个Segment才判定为岔路
    branch_detect_far_band_ratio: 0.7  # 只用较远的多少比例Band判断岔路
    
    # 分支选择参数（outer_side 已在上面定义，这里不需要重复）
    enable_continuity_branch_selection: false  # 无GuideBoard时是否按路径连续性选分支；false=严格使用outer_side
    branch_continuity_max_dx_ratio: 0.35  # 连续分支候选与上一帧中心线允许的最大x距离比例
    branch_continuity_near_band_ratio: 0.5  # 用靠近车身的多少比例Band判断路径连续性
    enable_locked_path_continuity: true  # LOCK后期优先跟随当前路径连续segment，避免回主路前被GuideBoard指定侧的新segment拉走
    locked_path_continuity_after_time: 0.5  # 进入LOCK多少秒后启用路径连续性取点；入口阶段仍优先执行GuideBoard选择
    locked_path_continuity_max_dx_ratio: 0.28  # LOCK连续取点允许的最大x距离比例
    branch_lock_time: 2.0  # 分支锁定的最大持续时间（秒）
    min_branch_lock_time: 0.8  # 分支锁定的最短持续时间（秒），避免LOCK/NORMAL频繁切换
    exit_single_path_confirm_frames: 5  # 连续多少帧检测到单路径才退出LOCK状态
    exit_single_path_min_ratio: 0.8  # 远端Band中至少多少比例为单路径才允许退出LOCK
    enable_merge_wide_segment_logic: true  # 启用合流宽路处理：宽单segment内继续沿当前侧取虚拟车道中心
    merge_wide_segment_ratio: 1.35  # 单segment宽度超过同一band常规车道宽度该倍率时，认为是合流宽路候选
    merge_wide_min_bands: 2  # 至少多少个band同时变宽才确认合流宽路
    merge_wide_confirm_frames: 2  # 连续多少帧满足条件才进入合流宽路锁定
    merge_wide_release_frames: 4  # 连续多少帧不满足条件才释放合流宽路锁定
    merge_wide_lane_width_alpha: 0.2  # 常规车道宽度的更新系数，越小越稳定
    
    # 中心线拟合参数
    fit_min_points: 5  # 拟合所需的最少点数，二阶拟合建议至少5个点
    fit_order: 2  # NORMAL拟合阶数，1=线性拟合，2=二次拟合
    branch_fit_order: 2  # LOCK岔路拟合阶数
    enable_fit_point_jump_filter: true  # 拟合前过滤连续Band中心点x跳变过大的点，抑制边缘误分割参与拟合
    max_fit_point_dx_ratio: 0.22  # 相邻拟合点允许的最大x跳变比例（相对图像宽度）
    max_fit_point_dx_px: 140.0  # 相邻拟合点允许的最大x跳变像素上限；<=0表示只用ratio
    enable_obstacle_avoidance: false  # 启用Human/Car障碍排斥，将其bbox膨胀区从赛道segment中扣除
    obstacle_labels: "Human,Car"  # 参与避障的检测类别，逗号分隔
    obstacle_min_confidence: 0.45  # 检测置信度低于该值不参与避障
    obstacle_x_margin_px: 25.0  # 障碍bbox左右膨胀像素
    obstacle_y_margin_px: 20.0  # 障碍bbox上下膨胀像素
    obstacle_max_age: 0.3  # detection结果超过该时间(s)不参与避障
    obstacle_min_bottom_y_ratio: 0.30  # bbox底部低于该画面y比例才参与避障，过滤远处/边缘误检
    enable_traffic_light_stop: true  # 启用红灯+斑马线停车请求
    traffic_light_min_confidence: 0.45  # 红/绿灯检测置信度阈值
    zebra_min_confidence: 0.45  # Zebra斑马线检测置信度阈值
    zebra_stop_y_ratio: 0.70  # Zebra bbox底部达到该画面高度比例时认为到达停车线
    traffic_light_max_age: 0.5  # 检测结果超过该时间(s)不用于红绿灯状态更新
    green_light_confirm_frames: 1  # 连续多少帧绿灯才解除停车
    red_light_confirm_frames: 1  # 连续多少帧红灯才进入红灯已见状态
    enable_finish_stop: true  # 启用终点Stop label停车
    finish_stop_min_confidence: 0.45  # Stop label置信度阈值
    finish_stop_arm_y_ratio: 0.70  # Stop bbox底部达到该画面高度比例后进入压线等待
    finish_stop_lost_frames: 3  # 接近Stop后连续多少帧看不到Stop才判定已压过终点
    finish_stop_max_age: 0.5  # 检测结果超过该时间(s)按未看到Stop处理
    enable_branch_bottom_anchor: true  # 仅LOCK时启用底部软锚点，让切入更平滑
    branch_bottom_anchor_x_ratio: 0.5  # 锚点x位置（0.5=画面中心）
    branch_bottom_anchor_y_ratio: 0.98  # 锚点y位置（靠近画面底部）
    branch_bottom_anchor_weight: 0.6  # 软锚点权重，小于1表示弱约束
    lookahead_y_ratio: 0.75  # 计算offset和heading的前瞻y位置
    use_heading_term: true  # 是否使用航向角误差项
    heading_weight: 0.10  # 航向角误差的权重，二阶拟合下保持保守
    near_offset_weight: 0.90  # 近处偏移量的权重
    
    # 安全参数
    max_offset_jump: 2.0  # Offset最大跳变幅度
    offset_smoothing_alpha: 0.35  # 一阶低通滤波系数
    
    # 调试参数
    show_branch_debug: true  # 是否在可视化窗口中绘制Band和Segment
    enable_status_log: true  # 是否输出“直行/NORMAL/Offset”心跳日志
    enable_branch_event_log: false  # 关闭岔路LOCK/释放事件日志
    publish_lane_state: true  # 发布/perception/lane_state，供控制器和后续避障/金币逻辑复用


# ========================================
# 参数调优指南
# ========================================
#ROS_LOCALHOST_ONLY=0
#ROS_PYTHON_VERSION=3
#ROS_VERSION=2
#SESSION_MANAGER=local/orangepi5:@/tmp/.ICE-unix/1863,unix/orangepi5:/tmp/.ICE-unix/1863
#SHELL=/bin/bash
#SHLVL=2
#SSH_AGENT_PID=2137
# 1. 如果车应该走外圈但走了内圈：
#    → 修改 outer_side: "left" ↔ "right"
#
# 2. 如果过早进入 LOCK 状态：
#    → 增大 branch_detect_min_bands
#    → 或增大 min_segment_gap_px
#    → 或减小 branch_detect_far_band_ratio，只看更远端的 Band
#
# 3. 如果检测不到岔路：
#    → 减小 branch_detect_min_bands
#    → 或减小 min_segment_gap_px
#    → 或增加 band_count
#
# 4. 如果锁定时间太长，过了岔路口还未释放：
#    → 减小 branch_lock_time
#    → 或减小 exit_single_path_confirm_frames
#    → 或减小 exit_single_path_min_ratio
#
# 5. 如果频繁在NORMAL和LOCK之间切换：
#    → 增大 min_branch_lock_time
#    → 或增大 exit_single_path_confirm_frames
#
# 6. 如果中心线抖动：
#    → 减小 offset_smoothing_alpha
#    → 或减小 max_offset_jump
#
# 7. ⭐ GuideBoard 岔路选择功能：
#    → enable_guideboard_branch_selection: true  # 启用GuideBoard检测
#    → guideboard_branch: "right"  # 检测到GuideBoard时走右侧岔路
#    → 默认情况下（无GuideBoard），走 outer_side 指定的方向
