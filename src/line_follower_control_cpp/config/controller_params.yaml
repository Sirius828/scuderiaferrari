

# C++ 巡线控制器参数。
#
# 调车建议按以下顺序进行，每次只改一组参数：
# 1. 安全与输入：确认话题、符号、超时和发车策略。
# 2. 基础 PD：关闭动态功能，只调 Kp、Kd。
# 3. 几何反馈：逐步增加近场偏差、航向误差和前瞻偏差权重。
# 4. 动态舵量/速度：确认低速稳定后，再提高 linear_speed。
#
# offset 的单位是图像归一化值，范围约为 [-1, 1]：
# - offset_y07/offset_y08/offset_y09：兼容 topic 名，实际远/中/近采样高度由感知 YAML 配置。
# - heading_error：拟合车道切线方向，范围约为 [-1, 1]。
# - curvature：拟合车道曲率，范围约为 [-1, 1]。
# 速度命令 linear.x 会转换为轮速 rps，舵量 command.angular.z 范围为 [-1, 1]。

/**:
  ros__parameters:
    # 机械转向连杆消除大死区后的重新标定基线：先低速只调 P，再逐步增加 Kd。
    Kd: 0.25
    Kp: 0.86
    autonomous_enabled_on_start: false
    branch_error_recovery_rate: 0.0
    branch_error_slew_rate: 0.0
    branch_exit_hold_time: 0.2
    branch_max_speed: 0.0
    branch_max_steering: 0.0
    branch_min_speed: 0.0
    branch_outer_bias_release_time: 0.8
    centerline_bias: 0.05
    cmd_vel_topic: /cmd_vel
    control_frequency: 50.0
    curvature_speed_weight: 0.12
    curvature_topic: /segmentation/curvature
    curve_allowed_offset: 0.6
    curve_entry_error_override: 0.85
    curve_entry_error_start: 0.3
    curve_entry_heading_confirm: 0.4
    curve_entry_max_steering: 0.0
    curve_entry_window_time: 0.0
    curve_max_steering: 0.65
    curve_offset_relief_full: 0.6
    curve_offset_relief_start: 0.15
    curve_outer_bias: 0.0
    curve_outer_bias_full: 0.5
    curve_outer_bias_hold_time: 0.0
    curve_outer_bias_start: 0.35
    derivative_brake_gain: 1.0
    derivative_filter_alpha: 0.3
    derivative_limit: 1.3
    enable_adaptive_offset_weights: false
    enable_curve_offset_allowance: false
    enable_curve_offset_relief: false
    enable_dynamic_speed: false
    enable_dynamic_steering_limit: false
    enable_geometry_stall_auto_resume: true
    enable_line_loss_command_hold: true
    finish_turn_encoder_topic: "/chassis/encoder_count"
    finish_turn_encoder_counts: 20000
    finish_turn_speed_mps: 0.8
    finish_turn_steering: -1.0
    finish_turn_timeout_sec: 8.0
    finish_turn_encoder_max_age_sec: 0.30
    far_offset_speed_weight: 0.0
    geometry_stall_recovery_time: 0.5
    geometry_stall_timeout: 0.2
    global_offset_blend: 0.25
    global_offset_deadband: 0.02
    global_offset_topic: /segmentation/global_offset
    heading_error_topic: /segmentation/heading_error
    heading_feedback_gain: 0.12
    high_error_rescue_speed: 0.0
    high_error_rescue_start: 0.7
    inner_side_min_linear_speed: 0.0
    inner_side_offset_threshold: 0.05
    invalid_hold_speed: 0.1
    lane_state_topic: /perception/lane_state
    linear_speed: 1.0
    lock_branch_outer_bias: false
    lookahead_transition_gain: 0.0
    max_steering: 1.0
    min_linear_speed: 0.6
    min_perception_confidence: 0.5
    near_offset_advantage_full: 0.3
    near_offset_advantage_start: 0.06
    near_offset_y07_weight: 0.55
    near_offset_y08_weight: 0.4
    near_offset_y09_weight: 0.25
    offset_timeout: 0.25
    offset_y07_topic: /segmentation/offset_y07
    offset_y07_weight: 0.8
    offset_y08_topic: /segmentation/offset_y08
    offset_y08_weight: 0.2
    offset_y09_topic: /segmentation/offset_y09
    offset_y09_weight: 0.0
    qos_overrides./parameter_events.publisher.depth: 1000
    qos_overrides./parameter_events.publisher.durability: volatile
    qos_overrides./parameter_events.publisher.history: keep_last
    qos_overrides./parameter_events.publisher.reliability: reliable
    speed_accel_rate: 1.5
    speed_decel_rate: 5.0
    speed_error_rate_full: 3.0
    speed_error_rate_start: 1.5
    speed_offset_full: 0.45
    speed_offset_start: 0.08
    speed_slowdown_exponent: 1.0
    steering_offset_full: 0.6
    steering_offset_start: 0.2
    steering_return_slew_rate: 3.0
    steering_sign: 1.0
    steering_slew_rate: 3.0
    straight_allowed_offset: 0.05
    straight_max_steering: 0.65
    use_sim_time: false
    wheel_radius: 0.0275
